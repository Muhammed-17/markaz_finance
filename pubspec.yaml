name: quran_centers_finance
description: >-
  نظام إدارة الشؤون المالية والإدارية لمراكز تحفيظ القرآن الكريم -
  Flutter + Firebase + Clean Architecture + BLoC + Hive.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.0
  firebase_app_check: ^0.3.2

  # State management & architecture
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.7
  get_it: ^8.0.3
  dartz: ^0.10.1
  go_router: ^14.6.0
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Local cache (ليس مصدرًا موثوقًا للأرصدة أو الصلاحيات)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  connectivity_plus: ^6.1.0
  intl: any
  uuid: ^4.5.1
  file_picker: ^8.1.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-VF.ttf
        - asset: assets/fonts/cairo/Cairo-VF.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-VF.ttf
          weight: 700
